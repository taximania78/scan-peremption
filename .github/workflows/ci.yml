name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Informatif: ne bloque pas le merge (des CVE transitives sans
      # correctif disponible existent). Dependabot gère les mises à jour.
      - name: Audit dependencies (prod)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
