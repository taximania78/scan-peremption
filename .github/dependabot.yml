# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    # Indiquez ici le dossier où se trouve package.json
    directory: "/"
    # Vérifie les mises à jour tous les jours ouvrés (lun→ven) à 9h, heure de Paris.
    # (Dependabot ne tourne pas le week-end avec l'intervalle "daily".)
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Paris"
    # Limite le nombre de PR ouvertes en même temps pour ne pas être submergé
    open-pull-requests-limit: 5
    # Regroupe les mises à jour sûres (patch + minor) dans UNE seule PR par jour.
    # Les mises à jour majeures (potentiellement cassantes) restent en PR séparées,
    # pour qu'une major qui casse la CI ne bloque pas les correctifs sûrs.
    groups:
      dependances:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # better-sqlite3 est une dépendance "esclave" de @prisma/adapter-better-sqlite3,
    # qui impose la ligne 12 (^12.6.0). Un bump MAJEUR isolé (ex: 12→13) casse le
    # build Docker : npm installe deux copies natives et recompile l'imbriquée sans
    # prebuild-install (cf. incident PR #12). On bloque donc les majors de
    # better-sqlite3 ; elles ne seront remontées que consciemment, avec l'adaptateur.
    ignore:
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]

  # Les actions du workflow CI sont épinglées sur un SHA de commit (et non un tag
  # mutable). Sans cet écosystème, ces SHA ne seraient jamais mis à jour.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
